<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manifest Generator + Subpacks</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
<style>
*{font-family:'Vazirmatn',sans-serif;box-sizing:border-box}
body{background:linear-gradient(135deg,#fff5e6 0%,#ffe8cc 100%);color:#5a3714;margin:0;padding:20px}
.container{max-width:800px;margin:30px auto;background:#fff;border-radius:16px;padding:30px;border:1px solid #ffcc80}
.header{text-align:center;border-bottom:2px dashed #ff9800;margin-bottom:20px}
input[type=text],input[type=number],textarea{width:100%;padding:12px;border:2px solid #ffcc80;border-radius:10px;background:#fffaf0}
.uuid-section,.subpack-section{background:#fff3e0;padding:20px;border-radius:10px;margin:20px 0;border:1px solid #ffcc80}
.button{padding:12px 20px;border:none;border-radius:10px;cursor:pointer}
.button-primary{background:#ff9800;color:#fff}
.button-secondary{background:#ffcc80}
.subpack-card{background:#fff8f0;border:1px solid #ffcc80;padding:15px;border-radius:10px;margin-top:10px}
</style>
</head>
<body>
<div class="container">
<div class="header">
<h1>🛠️ ساخت فایل منی‌فست برای ریسورس پک</h1>
<p>نسخه دارای Subpacks</p>
</div>

<label>نام پک</label>
<input id="packName">

<label>توضیحات</label>
<textarea id="packDescription"></textarea>

<div class="uuid-section">
<label>UUID اول</label>
<input id="uuid1">
<label>UUID دوم</label>
<input id="uuid2">
<br><br>
<button class="button button-secondary" onclick="genBoth()">تولید UUID ها</button>
</div>

<div class="subpack-section">
<label><input type="checkbox" id="enableSubpacks"> فعال کردن Subpacks</label>

<div id="subpacksContainer" style="display:none">
<br>
<label>تعداد Subpack ها (حداقل 2)</label>
<input type="number" id="subpackCount" min="2" value="2">
<div id="subpackFields"></div>
</div>
</div>

<button class="button button-primary" onclick="generateManifest()">دانلود manifest.json</button>
</div>

<script>
function generateRandomUUID(){
return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{
const r=Math.random()*16|0,v=c==='x'?r:(r&0x3|0x8);
return v.toString(16);
});
}

function genBoth(){
let a=generateRandomUUID(),b=generateRandomUUID();
while(a===b)b=generateRandomUUID();
uuid1.value=a; uuid2.value=b;
}

function createSubpackFields(){
const count=Math.max(2,parseInt(document.getElementById('subpackCount').value)||2);
const c=document.getElementById('subpackFields');
c.innerHTML='';
for(let i=1;i<=count;i++){
c.innerHTML+=`
<div class="subpack-card">
<label>Folder Name ${i}</label>
<input type="text" class="subpack-folder">
<label>Display Name ${i}</label>
<input type="text" class="subpack-name">
</div>`;
}
}

document.getElementById('enableSubpacks').addEventListener('change',e=>{
subpacksContainer.style.display=e.target.checked?'block':'none';
if(e.target.checked) createSubpackFields();
});

document.getElementById('subpackCount').addEventListener('input',createSubpackFields);

function generateManifest(){
const manifest={
format_version:2,
header:{
name:packName.value.trim(),
description:packDescription.value.trim(),
uuid:uuid1.value.trim(),
version:[1,0,0],
min_engine_version:[1,20,0]
},
modules:[{
type:"resources",
uuid:uuid2.value.trim(),
version:[1,0,0]
}]
};

if(enableSubpacks.checked){
const folders=document.querySelectorAll('.subpack-folder');
const names=document.querySelectorAll('.subpack-name');
const subs=[];
for(let i=0;i<folders.length;i++){
if(folders[i].value.trim()&&names[i].value.trim()){
subs.push({
folder_name:folders[i].value.trim(),
name:names[i].value.trim(),
memory_tier:0
});
}
}
if(subs.length<2){
alert('حداقل دو Subpack کامل وارد کنید.');
return;
}
manifest.subpacks=subs;
}

const blob=new Blob([JSON.stringify(manifest,null,4)],{type:'application/json'});
const a=document.createElement('a');
a.href=URL.createObjectURL(blob);
a.download='manifest.json';
a.click();
}

genBoth();
</script>
</body>
    </html>

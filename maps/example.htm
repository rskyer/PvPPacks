<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#ff5500" />
  <link href="https://cdn.fontcdn.ir/Font/Persian/Mehr/Mehr.css" rel="stylesheet">
  <link href="./maps.css" rel="stylesheet">
  <title>PvPPacks_786 mapes ||
mn
</title>
<style>

@font-face {
    font-family: 'pelak';
    src: url('https://rskyer.github.io/AI_everywhere/o/pelak.ttf') format('truetype');
    font-weight: normal;
    font-style: normal;
}
* {
font-family: 'pelak'; }
body { 
font-family: 'pelak' }
<style>
  <!-- Open Graph -->
  <meta property="og:title" content="PvPPacks786 || mn" />
  <meta property="og:description" content="این مپ زیبا را در این سایت دانلود کنید." />
  <meta property="og:image" content="https://s786mc.github.io/PvPPacks786/image/pack.png" />
  <meta property="og:locale" content="fa_IR" />
</head>
<body>
  <header class="header">
    <div class="header-inner">
     <div id="pp-user-mini"></div>
<script src="../PvPPacks/r.js"></script>
 
      <div class="header-text" dir="ltr">@PvPPacks <div class="header-text" style=" color:red; "> Mapes </div></div>
    </div>
  </header>

  <main class="diagonal-section">
    <div class="content">
      <!-- بخش اطلاعات کلی (شبیه صفحه قبلی) -->
      <section class="map-info">
        <div class="map-top">
          <img src="./assets/icon.png" alt="آیکون Mapes" class="map-icon" id="icon" onclick="showAlert()" />
          <div class="map-meta">
            <h1 class="map-title"></h1>
            <p class="map-short"><strong>✅ نام:</strong> <span id="meta-name">

</span></p>
            <p class="map-compat"><strong>📊 سازگاری:</strong> نسخه‌های مختلف</p>
          </div>
        </div>

        <!-- ویدیو با کنترل‌های سفارشی -->
        <div class="video-wrapper">
          <video id="mapVideo" class="map-video" preload="metadata" poster="sub">
            <source src="" type="video/mp4">
            مرورگر شما از ویدیو پشتیبانی نمی‌کند.
          </video>

          <div class="video-controls" id="videoControls" data-state="hidden">
            <button class="vc-btn" id="playPause" title="پخش / توقف">▶</button>
            <div class="vc-progress" id="progressContainer">
              <div class="vc-progress-bar" id="progressBar"></div>
            </div>
            <div class="vc-time">
              <span id="currentTime">0:00</span> / <span id="duration">0:00</span>
            </div>
            <input id="volume" class="vc-volume" type="range" min="0" max="1" step="0.01" value="0.8" />
            <button class="vc-btn" id="muteBtn" title="بی‌صدا">🔊</button>
            <button class="vc-btn" id="fsBtn" title="تمام صفحه">⤢</button>
          </div>
        </div>

        <!-- تصویر بعد از ویدیو -->
        <img src="./assets" alt="تصویر Mapes" class="map-image" />

        <!-- اطلاعات تکمیلی -->
        <div class="map-details">
          <p><strong>موضوع:</strong> <span id="topic">name
</span></p>
          <p><strong>توضیحات:</strong> <span id="description">

des

</span></p>
          <p><strong>ورژن:</strong> <span id="version">
v
</span></p>
          <p><strong>سازنده:</strong> <span id="creator">

cre

</span></p>

        </div>

        <!-- دکمه‌ها -->
        <div class="action-buttons">
          <a href="#" class="btn primary" id="downloadBtn">دانلود مپ📥</a>
          <a href="#" class="btn secondary" id="previewBtn">tes</a>
          <button class="btn ghost" id="shareBtn">tes</button>
        </div>
      </section>
    </div>
  </main>

  <footer class="footer">
    <button class="creator-btn" onclick="showAlert()">@PvPPacks786</button>
    <p class="support-note">پشتیبانی: @iLegisus در تلگرام</p>
  </footer>

  <script src="./maps.js"></script>
</body>
</html>

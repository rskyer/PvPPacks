<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta lang="fa">
    
    <!-- Meta Tags مشابه وبسایت اصلی -->
    <meta property="og:title" content="@PvPPacks - جستجوی امن">
    <meta property="og:description" content="PvPPacks786 Search">
    <meta property="og:image" content="https://rskyer.github.io/PvPPacks/image/icon.png">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Searching at the web!">
    <meta property="og:locale" content="fa_IR">
    
    <!-- Favicon -->
    <link rel="icon" href="https://rskyer.github.io/PvPPacks/image/icon.png" type="image/png">
    
    <!-- استایل‌ها -->
    <link rel="stylesheet" href="https://rskyer.github.io/PvPPacks/styles.css">
    <link rel="stylesheet" href="s.css">
    
    <!-- فونت‌ها -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/mikhak-font@v2.0/dist/font-face.css" rel="stylesheet">
    
    <title>PvPPacks - جستجوی امن</title>
    <meta name="theme-color" content="#ff5500">
</head>
<body>
    <!-- هدر مشابه وبسایت اصلی -->
    <header class="header">
        <div id="pp-user-mini"></div>
        <div class="header-text" dir="ltr">PvPPacks  <div style=" color: orange; ">Search </div> </div>
    </header>
    
    <!-- بخش اصلی جستجو -->
    <section class="diagonal-section">
        <div class="content">
            <strong>
                <p class="tro">
                   جستجو<br>
                </p>
            </strong>
            <br>
            
            <!-- فرم جستجو -->
            <div class="search-container">
                <form id="searchForm">
                    <div class="search-box">
                        <input 
                            type="text" 
                            id="searchInput" 
                            placeholder="چی می‌خوای جستجو کنی؟..." 
                            autocomplete="off"
                            dir="rtl"
                        >
                        <button type="submit" class="search-btn">
                            🔍
                        </button>
                    </div>
                    
                    <div class="search-options">
                        <label class="option">
                            <input type="radio" name="searchType" value="ddg" checked>
                            <span>OnLine</span>
                        </label>
                    </div>
                </form>
                
                <!-- دکمه‌های سریع -->
                <div class="quick-searches">
                    <p class="p-center">جستجوهای سریع:</p>
                    <div class="quick-buttons">
                        <button class="quick-btn" data-search="Minecraft PvP Pack">پک PvP</button>
                        <button class="quick-btn" data-search="Minecraft texture pack">پک تکسچر</button>
                        <button class="quick-btn" data-search="Minecraft shader">شیدر ماینکرفت</button>
                        <button class="quick-btn" data-search="gaming news">اخبار گیمینگ</button> <br><br><br><br>
                    </div>
                </div>
            </div>
        </div>
    </section>
    
    <!-- دکمه‌های ناوبری -->
    <div class="dokme-row">
        <a class="dokme" href="https://rskyer.github.io/PvPPacks/packs/page">پک‌ها</a>
        <a class="dokme" href="https://rskyer.github.io/PvPPacks">صفحه اصلی</a>
    </div>
    
    <!-- اسکریپت‌ها -->
    <script src="https://rskyer.github.io/PvPPacks/PvPPacks/r.js"></script>
    <script src="yandex.js"></script>
</body>
</html>

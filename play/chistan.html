
<!--- کپی کنی حرومت پاره شدم ---!> 







<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta http-equiv="CONTENT-TYPE" content="text/html; charset=UTF-8">
  <title>Guess The Word</title>
  <style>
    @font-face {
      font-family: "parsi";
      src: url('https://rskyer.github.io/AI_everywhere/o/pelak.ttf') format('truetype');
    }
    
    * {
      font-family: "parsi", 'Iran-sans', sans-serif;
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      text-align: center;
      background: linear-gradient(135deg, skyblue 0%, #126899 100%);
      padding: 20px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    
    .container {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      padding: 100px;
      max-width: 1600px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    
    #title {
      color: #2c3e50;
      font-size: 2.5em;
      margin-bottom: 10px;
    }
    
    .info {
      display: flex;
      justify-content: space-around;
      margin: 15px 0;
    }
    
    #level, #chances {
      display: inline-block;
      background: #3498db;
      color: white;
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 16px;
    }
    
    #chances {
      background: #e74c3c;
    }
    
    hr {
      border: 1px dashed #bdc3c7;
      margin: 15px 0;
    }
    
    #hintArea {
      font-size: 28px;
      color: #e74c3c;
      background: #fef9e7;
      padding: 25px;
      border-radius: 15px;
      display: inline-block;
      min-width: 250px;
      min-height: 80px;
      border: 3px dashed #3498db;
      margin: 15px 0;
      font-weight: bold;
      transition: all 0.3s;
    }
    
    #hintArea.win {
      border-color: #2ecc71;
      color: #27ae60;
      background: #eafaf1;
    }
    
    #inputWord {
      padding: 12px 20px;
      font-size: 20px;
      border: 2px solid #3498db;
      border-radius: 10px;
      width: 80%;
      margin: 10px 0;
      transition: all 0.3s;
      text-align: center;
    }
    
    #inputWord:focus {
      outline: none;
      border-color: #2ecc71;
      box-shadow: 0 0 15px rgba(46, 204, 113, 0.3);
    }
    
    .btn-primary {
      padding: 12px 40px;
      font-size: 20px;
      background: #2ecc71;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s;
      margin: 5px;
    }
    
    .btn-primary:hover {
      background: #27ae60;
      transform: scale(1.05);
    }
    
    .btn-primary:active {
      transform: scale(0.95);
    }
    
    .settings {
      margin-top: 30px;
      padding-top: 20px;
      border-top: 2px solid #ecf0f1;
    }
    
    #settings {
      color: #7f8c8d;
      margin-bottom: 10px;
      font-size: 18px;
    }
    
    .setBut {
      padding: 20px 25px;
      margin: 5px;
      background: #3498db;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      transition: all 0.3s;
    }
    
    .setBut:hover {
      background: #2980b9;
      transform: scale(1.05);
    }
    
    .setBut.danger {
      background: #e74c3c;
    }
    
    .setBut.danger:hover {
      background: #c0392b;
    }
    
    .setBut.success {
      background: #f39c12;
    }
    
    .setBut.success:hover {
      background: #e67e22;
    }
    
    .status {
      margin-top: 10px;
      font-size: 14px;
      color: #95a5a6;
    }
    
    @media (max-width: 500px) {
      .container {
        padding: 20px;
      }
      #title {
        font-size: 1.8em;
      }
      #inputWord {
        width: 100%;
        font-size: 16px;
      }
      #hintArea {
        font-size: 22px;
        min-width: 150px;
        min-height: 60px;
        padding: 15px;
      }
    }
  version {
    font-family: 'Samsung One', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    color: #666;
    font-size: 11px;
    font-weight: 300;
    opacity: 0.6;
    letter-spacing: 0.3px;
    margin-top: 25px;
    text-align: center;
}
  </style>
</head>
<body>

<div class="container" id="container">
  <h1 id="title"> حدس بزن من چیم...</h1>
  
  <div class="info">
    <h3 id="level">مرحله: 1</h3>   
    <h3 id="chances">شانس‌ها: 20</h3>
  </div>
  
  <hr>
  
  <p id="hintArea">درحال راه‌اندازی...</p>
  
  <div>
    <input type="text" id="inputWord" placeholder="کلمه حدسی رو بنویس...">
    <br>
    <button class="btn-primary" onclick="check()">چک کردن</button>
  </div>
  
  <div class="settings">
    <h4 id="settings"> تنظیمات بیشتر:</h4>
    <button class="setBut success" onclick="saveLevel()">ذخیره مرحله</button>
    <button class="setBut" onclick="reset()"> ریست بازی</button>
    <button class="setBut danger" onclick="resetLocal()"> حذف اطلاعات</button>
    <button class="setBut" onclick="changeColor()">تنظیم رنگ</button><br>
    <version>Guess the word - v26.1</version>
  </div>
  
  <div class="status" id="statusBar">اطلاعات در لوکال استورج ذخیره میشه</div>
</div>

<script>
  let clickS = new Audio("https://rskyer.github.io/PvPPacks/play/guessNumber/sounds/click.ogg");
  let winS = new Audio("https://rskyer.github.io/PvPPacks/play/guessNumber/sounds/win.ogg");
    let loseS = new Audio("https://rskyer.github.io/PvPPacks/play/guessNumber/sounds/lose.ogg");
    let nextLevS = new Audio("https://rskyer.github.io/PvPPacks/play/guessNumber/sounds/reload.ogg");
  function playsound(sound) {
    sound.play().catch(error => {
        console.log('Error playing sound:', error)
    })
  }
  let title = document.getElementById("title");
  let levelHTML = document.getElementById("level");
  let chancesHTML = document.getElementById("chances");
  let hintArea = document.getElementById("hintArea");
  let statusBar = document.getElementById("statusBar");
let textArea = document.getElementById("inputWord");
  function setText(text) {
    textArea.placeholder = text
  }
  let userLevel = localStorage.getItem("userLevel") ? parseInt(localStorage.getItem("userLevel")) : 1;
  let hint = "";
  let chances = 20;
  let targetWord = "";
let targetWordHint = "";
  
  let words = {
    1: "بارون",
    2: "حوله",
    3: "فردا",
    4: "آینده",
    5: "چاله",
    6: "اسم",
    7: "صابون",
    8: "سکوت",
    9: "قول",
    
    10: "روشنایی"
  };
  let hints = {
    1: "بنویس بارون!",
    2: "اون چیه که هرچقدر خیس‌تر میشه، بیشتر خشک میکنه؟",
    3: "اون چیه که همیشه داره میاد اما هیچ‌وقت نمی‌رسه؟",
    4: "همیشه جلوی توعم و هیچ وقت بهم نمی‌رسی!",
    5: "اون چیه که هرچقدر ازش برداری بزرگ‌تر میشه؟",
    6: "اون چیه که ماله شماست ولی بقیه معمولا ازش بیشتر استفاده میکنن؟",
    7: "هرچقدر ازش استفاده بکنی، کوچک‌تر میشه؟",
    8: "اون چیه که وقتی می‌گیش شکسته میشه!؟",
    9: "وقتی شکسته میشه دیگه مثل قبل نمیشه...:(",
    10: "وقتی میاد، تاریکی میره...:)",
  }
function changeColor() {
    let con = document.getElementById("container")
    let existingPanel = document.getElementById("colorPanel")
    if (existingPanel) {
        existingPanel.remove()
        return
    }
    let panel = document.createElement("div")
    panel.id = "colorPanel"
    panel.className = "color-panel"
    panel.style.cssText = "padding:20px; margin:10px 0; background:#f8f9fa; border-radius:10px; border:2px solid #ddd;"
    panel.innerHTML = `
        <h4>🎨 رنگ هارو انتخاب کن:</h4>
        <br>
        <label>رنگ پشت‌زمینه ۱</label>
        <input type="color" id="bgcolor" value="aqua">
        <br><br>
        <label>رنگ پشت‌زمینه ۲</label>
        <input type="color" id="bgcolor2" value="skyblue">
        <br><br>
        <button onclick="applyColors()" class="setBut success">✔ اعمال</button>
        <button onclick="cancelChangeColor()" class="setBut danger">× کنسل</button>
    `
    con.appendChild(panel)
}

function cancelChangeColor() {
    let panel = document.getElementById("colorPanel")
    if (panel) panel.remove()
}

function applyColors() {
    let color1 = document.getElementById("bgcolor").value
    let color2 = document.getElementById("bgcolor2").value
    document.body.style.background = `linear-gradient(135deg, ${color1}, ${color2})`
    localStorage.setItem("bgColor1", color1)
    localStorage.setItem("bgColor2", color2)
    cancelChangeColor()
}
  function setHint(hinttext) {
    hint = hinttext;
    hintArea.textContent = hint;
    hintArea.classList.remove("win");
  }

  function update(level, chans) {
    levelHTML.textContent = "مرحله: " + level;
    chancesHTML.textContent = "شانس‌ها: " + chans;
  }

  function check() {
        if (chances <= 0) {
        playsound(loseS);
        alert(":/شانس‌ات تموم شد! بازی ریست میشه.");
        reset();
        return;
    } else if(userLevel > 12) {
      userLevel = 11
      update(11, 10)
    }
    
    playsound(clickS)
    let userInput = document.getElementById("inputWord").value.trim();
    
    if (userInput === "") {
      setText(" هیچ‌چیزی وارد نکردی!");
      return;
    
    }
    
    chances -= 1;
    update(userLevel, chances);
    
    if (userInput === targetWord) {
      hintArea.classList.add("win");
      playsound(winS)
   
      setText(" برنده شدی! به مرحله " + (userLevel + 1) + " صعود کردی!")
      userLevel += 1;
      chances = 20;
      localStorage.setItem("userLevel", userLevel);
      statusBar.textContent = "  ذخیره شد: مرحله " + userLevel;
      
      if (words[userLevel]) {
        targetWord = words[userLevel];
        targetWordHint = hints[userLevel];
        setHint("💡 " + targetWordHint || "تموم");
      } else {
        playsound(winS);
        setHint("🀠آفرین! همه مراحل رو تموم کردی!");
        statusBar.textContent = "شما قبلا بازی رو تموم کردین.";
        return;
      }
      
      update(userLevel, chances);
      document.getElementById("inputWord").value = "";
    } else {
      alert(" اشتباه بود! دوباره تلاش کن. شانس باقی‌مونده: " + chances);
      if (chances <= 0) {
        playsound(loseS);
        title.style.color = "red"
        title.textContent = ":/شانس‌ات تموم شد! بازی ریست میشه."
        reset();
      }
    }
  }

  function saveLevel() {
    localStorage.setItem("userLevel", userLevel);
    statusBar.textContent = " مرحله " + userLevel + " ذخیره شد!";
    alert("مرحله " + userLevel + " ذخیره شد!");
  }

  function reset() {
    if (confirm("مطمئنی میخوای بازی رو از اول شروع کنی؟")) {
      localStorage.removeItem("userLevel");
      location.reload();
    }
  }

  function resetLocal() {
    if (confirm("همه اطلاعات ذخیره شده رو حذف کنم؟")) {
      localStorage.clear();
      statusBar.textContent = "همه اطلاعات پاک شد!";
      location.reload();
    }
  }

  if (words[userLevel]) {
    targetWord = words[userLevel];
    targetWordHint = hints[userLevel];
    setHint("💡 " + targetWordHint);
  } else {
    setHint("تبریک! همه مراحل رو تموم کردی!");
    statusBar.textContent = "بازی کامل شد!";
  }

  update(userLevel, chances);
  statusBar.textContent = "مرحله فعلی: " + userLevel + " | ";
  
  document.getElementById("inputWord").addEventListener("keypress", function(e) {
    if (e.key === "Enter") {
      check();
    }
  });

  console.log("game start");
  console.log("مرحله کاربر:", userLevel);
  console.log("کلمه هدف:", targetWord);
</script>

</body>
</html>
